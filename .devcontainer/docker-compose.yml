# Services: Defines each containerized application in our setup.
services:
  # 'db': The PostgreSQL database container.
  db:
    image: postgres:latest
    container_name: db-service
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql
      - ../migrations/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  postgrest:
    image: postgrest/postgrest
    container_name: postgrest-service
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
    depends_on:
      - db

  # 'db': The MySQL database container (Commented out).
  # db:
  #   # image: Instead of building, we use an "Official Image" from Docker Hub.
  #   image: mysql:latest
  #   container_name: db-service
  #   # restart: always: Automatically restarts if it crashes or you reboot.
  #   restart: always
  #   # env_file:
  #   #   - ../.env
  #   # environment: Direct environment variables, like root passwords.
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE}
  #     MYSQL_USER: ${MYSQL_USER}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  #   volumes:
  #     - db-data:/var/lib/mysql
  #     - ../migrations/init:/docker-entrypoint-initdb.d
  #   ports:
  #     - "3306:3306"

  # 'phpmyadmin': A web-based manager for MySQL.
  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   container_name: phpmyadmin-service
  #   restart: always
  #   # env_file:
  #   #   - ../.env
  #   environment:
  #     # PMA_HOST: Tells phpMyAdmin which database service to connect to.
  #     PMA_HOST: db-service
  #     PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - db

  # 'frontend': React/Vite application.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-service
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ..:/workspaces/NMAP-Data-Correlation-Platform:cached
      - ../frontend:/app
      - /app/node_modules # Prevents local node_modules from overwriting container node_modules
    depends_on:
      - db

volumes:
  db-data: